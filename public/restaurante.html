<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Operación Restaurante — Grupo Cotorreo</title>
<link rel="stylesheet" href="/css/styles.css">
</head>
<body>

<div class="app">
  <div class="app-header">
    <div class="user-info">
      <div>
        <h1>🍽️ Operación Restaurante</h1>
        <div class="subtitle" id="todayText"></div>
      </div>
      <button onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="hoy">Hoy</button>
    <button class="tab" data-tab="nueva-mesa">+ Mesa</button>
    <button class="tab" data-tab="nueva-cancha">+ Cancha</button>
  </div>

  <div class="tab-content active" id="tab-hoy">
    <div class="card">
      <h3>🍽️ Cotorreo — Hoy</h3>
      <div id="cotorreo-hoy" class="loading">Cargando</div>
    </div>
    <div class="card">
      <h3>🎾 Alpadel — Hoy</h3>
      <div id="alpadel-hoy" class="loading">Cargando</div>
    </div>
  </div>

  <div class="tab-content" id="tab-nueva-mesa">
    <div class="card">
      <h3>Nueva reserva mesa (teléfono)</h3>
      <div id="busc-mesa"></div>
      <hr style="margin:14px 0; border:none; border-top:1px solid var(--border);">
      <div class="form-group"><label>Fecha y hora *</label><input type="datetime-local" id="m-fechahora"></div>
      <div class="form-group"><label>Personas *</label><input type="number" id="m-personas" min="1" max="20"></div>
      <div class="form-group"><label>Ocasión</label><select id="m-ocasion">
        <option value="Ninguna">Ninguna</option><option value="Cumpleanos">Cumpleaños</option>
        <option value="Aniversario">Aniversario</option><option value="Familiar">Familiar</option>
        <option value="Negocios">Negocios</option><option value="Otra">Otra</option>
      </select></div>
      <div class="form-group"><label>Área</label><select id="m-area">
        <option value="">Sin preferencia</option>
        <option>Planta baja</option><option>Planta alta</option>
        <option>Cerca del playground</option>
        <option>Planta alta pasillo con vista al arroyo</option>
        <option>Balcón por pool</option><option>Sillas moradas</option>
      </select></div>
      <div class="form-group"><label>Notas</label><textarea id="m-notas"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="crearMesa()">Crear reserva</button>
    </div>
  </div>

  <div class="tab-content" id="tab-nueva-cancha">
    <div class="card">
      <h3>Nueva reserva cancha (teléfono)</h3>
      <div id="busc-cancha"></div>
      <hr style="margin:14px 0; border:none; border-top:1px solid var(--border);">
      <div class="form-group"><label>Fecha *</label><input type="date" id="c-fecha"></div>
      <div class="form-group"><label>Hora *</label><select id="c-hora"></select></div>
      <div class="form-group"><label>Duración *</label><select id="c-duracion">
        <option value="1" selected>1h</option><option value="1.5">1h 30</option><option value="2">2h</option>
      </select></div>
      <div class="form-group"><label>Cancha *</label><select id="c-cancha">
        <option value="Dobles">Cancha 1 — Dobles</option>
        <option value="Singles">Cancha 2 — Singles</option>
      </select></div>
      <div class="form-group"><label>Notas</label><textarea id="c-notas"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="crearCancha()">Crear reserva</button>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
if (!requireRole(["saloneros", "lili", "gerencia"])) throw new Error("Sin permiso");
document.getElementById("todayText").textContent = new Date().toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long" });

document.getElementById("c-fecha").value = todayISO();
const horaSel = document.getElementById("c-hora");
horaSel.innerHTML = '<option value="">Selecciona...</option>';
for (let i = 7; i <= 22; i++) {
  horaSel.innerHTML += `<option>${String(i).padStart(2,"0")}:00</option>`;
  if (i < 22) horaSel.innerHTML += `<option>${String(i).padStart(2,"0")}:30</option>`;
}

document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
  });
});

async function loadHoy() {
  try {
    const d = await api("GET", "/api/reservas/hoy");
    document.getElementById("cotorreo-hoy").innerHTML = renderRes(d.cotorreo, "cotorreo") || "<em>Sin reservas</em>";
    document.getElementById("alpadel-hoy").innerHTML = renderRes(d.alpadel, "alpadel") || "<em>Sin reservas</em>";
  } catch (e) { alert(e.message); }
}

function renderRes(items, tipo) {
  if (!items.length) return "";
  return items.map(r => {
    const estadoClass = (r.estado || "Confirmada").toLowerCase().replace("-", "");
    const meta = tipo === "alpadel"
      ? `${r.cancha} · ${r.duracion}h`
      : `${r.personas} pax${r.ocasion && r.ocasion !== "Ninguna" ? " · " + r.ocasion : ""}${r.area ? " · " + r.area : ""}`;
    return `
      <div class="reserva estado-${estadoClass}">
        <div class="reserva-info">
          <div class="reserva-hora">${fmtHora(r.fechaHora)}</div>
          <div class="reserva-nombre">${r.nombre}</div>
          <div class="reserva-meta">${meta}</div>
          <span class="badge ${estadoClass}">${r.estado}</span>
        </div>
        <div class="reserva-acciones">
          <button class="btn btn-success btn-sm" onclick="cambiarEstado('${tipo}','${r.id}','Completada')">✓</button>
          <button class="btn btn-warning btn-sm" onclick="cambiarEstado('${tipo}','${r.id}','No-show')">👻</button>
          <button class="btn btn-danger btn-sm" onclick="cambiarEstado('${tipo}','${r.id}','Cancelada')">✗</button>
        </div>
      </div>
    `;
  }).join("");
}

async function cambiarEstado(tipo, id, estado) {
  try {
    await api("PATCH", `/api/reservas/${tipo}/${id}/estado`, { estado });
    loadHoy();
  } catch (e) { alert(e.message); }
}

// === Selector de cliente reutilizable ===
const clienteSel = { mesa: null, cancha: null };

function buscadorHTML(prefix, contextKey) {
  return `
    <div class="form-group">
      <label>Buscar cliente existente</label>
      <input type="text" id="${prefix}-buscar" placeholder="Nombre o teléfono" oninput="buscarClientes('${prefix}','${contextKey}')">
      <div id="${prefix}-resultados" style="margin-top:6px;"></div>
    </div>
    <div id="${prefix}-sel" style="display:none; padding:10px; background:var(--green-soft); border-radius:8px; margin-bottom:10px;">
      <strong id="${prefix}-sel-nombre"></strong>
      <button type="button" class="btn btn-sm btn-secondary" style="margin-left:8px;" onclick="limpiarCliente('${prefix}','${contextKey}')">Cambiar</button>
    </div>
    <div id="${prefix}-nuevo">
      <div class="form-group"><label>Nombre *</label><input type="text" id="${prefix}-nombre"></div>
      <div class="form-group"><label>Teléfono *</label><input type="tel" id="${prefix}-telefono"></div>
      <div class="form-group"><label>Email *</label><input type="email" id="${prefix}-email"></div>
      <div class="form-group">
        <label>Cumpleaños * (día y mes)</label>
        <div style="display:flex; gap:8px;">
          <select id="${prefix}-cumpleDia" style="flex:1;">${diasOpts()}</select>
          <select id="${prefix}-cumpleMes" style="flex:2;">${mesesOpts()}</select>
        </div>
      </div>
    </div>
  `;
}
function diasOpts() {
  let h = '<option value="">Día</option>';
  for (let i = 1; i <= 31; i++) h += `<option value="${String(i).padStart(2,"0")}">${i}</option>`;
  return h;
}
function mesesOpts() {
  const m = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
  let h = '<option value="">Mes</option>';
  m.forEach((n, i) => h += `<option value="${String(i+1).padStart(2,"0")}">${n}</option>`);
  return h;
}

document.getElementById("busc-mesa").innerHTML = buscadorHTML("m", "mesa");
document.getElementById("busc-cancha").innerHTML = buscadorHTML("c", "cancha");

async function buscarClientes(prefix, contextKey) {
  const q = document.getElementById(prefix + "-buscar").value;
  if (q.length < 2) { document.getElementById(prefix + "-resultados").innerHTML = ""; return; }
  try {
    const r = await api("GET", `/api/clientes/buscar?q=${encodeURIComponent(q)}`);
    if (!r.clientes.length) {
      document.getElementById(prefix + "-resultados").innerHTML = "<small>No hay resultados. Llena los datos abajo para crear nuevo.</small>";
      return;
    }
    document.getElementById(prefix + "-resultados").innerHTML = r.clientes.map(c =>
      `<div onclick="seleccionarCliente('${prefix}','${contextKey}','${c.id}','${(c.nombre||"").replace(/'/g,"\\'")}','${c.telefono||""}')" style="padding:8px; border:1px solid var(--border); border-radius:6px; margin-bottom:4px; cursor:pointer; background:white;"><strong>${c.nombre}</strong> · ${c.telefono || ""}</div>`
    ).join("");
  } catch (e) { console.error(e); }
}

function seleccionarCliente(prefix, contextKey, id, nombre, telefono) {
  clienteSel[contextKey] = { id, nombre, telefono };
  document.getElementById(prefix + "-sel").style.display = "block";
  document.getElementById(prefix + "-sel-nombre").textContent = `${nombre} (${telefono})`;
  document.getElementById(prefix + "-nuevo").style.display = "none";
  document.getElementById(prefix + "-resultados").innerHTML = "";
  document.getElementById(prefix + "-buscar").value = "";
}
function limpiarCliente(prefix, contextKey) {
  clienteSel[contextKey] = null;
  document.getElementById(prefix + "-sel").style.display = "none";
  document.getElementById(prefix + "-nuevo").style.display = "block";
}

function datosCliente(prefix, contextKey) {
  if (clienteSel[contextKey]) {
    return { clienteId: clienteSel[contextKey].id, nombre: clienteSel[contextKey].nombre, telefono: clienteSel[contextKey].telefono };
  }
  return {
    nombre: document.getElementById(prefix + "-nombre").value,
    telefono: document.getElementById(prefix + "-telefono").value,
    email: document.getElementById(prefix + "-email").value,
    cumpleanosDia: document.getElementById(prefix + "-cumpleDia").value,
    cumpleanosMes: document.getElementById(prefix + "-cumpleMes").value,
  };
}

async function crearMesa() {
  const data = Object.assign(datosCliente("m", "mesa"), {
    fechaHora: document.getElementById("m-fechahora").value,
    personas: parseInt(document.getElementById("m-personas").value),
    ocasion: document.getElementById("m-ocasion").value,
    area: document.getElementById("m-area").value,
    notas: document.getElementById("m-notas").value,
  });
  if (!data.nombre || !data.telefono || !data.fechaHora || !data.personas)
    return alert("Faltan datos");
  try {
    await api("POST", "/api/reservas/cotorreo/manual", data);
    alert("✅ Mesa reservada");
    document.querySelector('[data-tab="hoy"]').click();
    loadHoy();
  } catch (e) { alert(e.message); }
}

async function crearCancha() {
  const data = Object.assign(datosCliente("c", "cancha"), {
    fecha: document.getElementById("c-fecha").value,
    hora: document.getElementById("c-hora").value,
    duracion: parseFloat(document.getElementById("c-duracion").value),
    cancha: document.getElementById("c-cancha").value,
    tipo: "Regular",
    notas: document.getElementById("c-notas").value,
  });
  if (!data.nombre || !data.telefono || !data.fecha || !data.hora)
    return alert("Faltan datos");
  try {
    await api("POST", "/api/reservas/alpadel/manual", data);
    alert("✅ Cancha reservada");
    document.querySelector('[data-tab="hoy"]').click();
    loadHoy();
  } catch (e) { alert(e.message); }
}

loadHoy();
</script>
</body>
</html>
