<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acceso interno — Grupo Cotorreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    color: var(--text-primary);
    background: var(--surface-page);
    line-height: var(--leading-normal);
    font-size: var(--text-base);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: var(--content-max);
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Logo bloque arriba (centrado, sin nav back — esta es la raíz interna) */
  .brand-block {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: var(--space-12) var(--space-4) var(--space-6);
  }

  .brand-logo {
    height: 140px;
    width: auto;
    mix-blend-mode: multiply;
    display: block;
  }

  .brand-tag {
    margin-top: var(--space-2);
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }

  /* Main */
  .main {
    flex: 1;
    padding: 0 var(--space-4) var(--space-8);
  }

  .page-title {
    font-size: var(--text-2xl);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    text-align: center;
    margin-bottom: var(--space-2);
    line-height: var(--leading-tight);
  }

  .page-subtitle {
    font-size: var(--text-sm);
    color: var(--text-secondary);
    text-align: center;
    margin-bottom: var(--space-6);
  }

  /* Card login */
  .login-card {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-6) var(--space-5);
    max-width: 420px;
    margin: 0 auto;
    box-shadow: var(--shadow-sm);
  }

  .form-group {
    margin-bottom: var(--space-5);
  }

  .form-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin-bottom: var(--space-2);
  }

  .form-label-hint {
    font-size: var(--text-xs);
    font-weight: var(--weight-regular);
    color: var(--text-tertiary);
  }

  .input-wrap {
    position: relative;
    display: flex;
    align-items: stretch;
    border: 1.5px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--surface-card);
    transition: border-color var(--t-base), box-shadow var(--t-base);
    overflow: hidden;
  }

  .input-wrap:focus-within {
    border-color: var(--color-primary);
    box-shadow: var(--shadow-focus);
  }

  .input-pin {
    flex: 1;
    height: var(--input-h);
    padding: 0 var(--space-3);
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: var(--text-xl);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
    outline: none;
    min-width: 0;
    letter-spacing: 0.4em;
    text-align: center;
    -webkit-appearance: none;
    appearance: none;
  }

  .input-pin::placeholder {
    color: var(--text-tertiary);
    letter-spacing: 0.2em;
    font-weight: var(--weight-regular);
  }

  .pin-toggle {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    background: transparent;
    border: none;
    border-left: 1px solid var(--border-subtle);
    color: var(--text-secondary);
    cursor: pointer;
    transition: color var(--t-fast), background var(--t-fast);
  }

  .pin-toggle:hover {
    color: var(--text-primary);
    background: var(--surface-muted);
  }

  .pin-toggle svg {
    width: 18px;
    height: 18px;
  }

  /* Botón primario */
  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: var(--input-h);
    padding: 0 var(--space-5);
    background: var(--color-primary);
    color: var(--text-on-brand);
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    cursor: pointer;
    transition: background var(--t-fast), transform var(--t-fast);
  }

  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-primary svg {
    width: 18px;
    height: 18px;
  }

  /* Feedback inline */
  .feedback {
    margin-top: var(--space-4);
    padding: var(--space-3) var(--space-4);
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    display: none;
    align-items: flex-start;
    gap: var(--space-2);
  }

  .feedback.visible { display: flex; }

  .feedback.success {
    background: var(--color-success-bg);
    color: var(--color-success);
    border-left: 3px solid var(--color-success);
  }

  .feedback.error {
    background: var(--color-danger-bg);
    color: var(--color-danger);
    border-left: 3px solid var(--color-danger);
  }

  .feedback.warn {
    background: var(--color-accent-warn-bg);
    color: #8B6914;
    border-left: 3px solid var(--color-accent-warn);
  }

  .feedback svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* Sección secundaria: cliente que llegó por error */
  .alt-link {
    margin-top: var(--space-6);
    text-align: center;
    font-size: var(--text-sm);
    color: var(--text-secondary);
  }

  .alt-link a {
    color: var(--color-primary);
    text-decoration: none;
    font-weight: var(--weight-semibold);
    transition: color var(--t-fast);
  }

  .alt-link a:hover {
    color: var(--color-primary-hover);
    text-decoration: underline;
  }

  /* Footer minimalista */
  .login-footer {
    margin-top: auto;
    padding: var(--space-6) var(--space-4);
    text-align: center;
    font-size: var(--text-xs);
    color: var(--text-tertiary);
  }

  .login-footer a {
    color: var(--text-tertiary);
    text-decoration: none;
    transition: color var(--t-fast);
  }

  .login-footer a:hover {
    color: var(--text-secondary);
    text-decoration: underline;
  }

  /* Lock icon arriba del título (decorativo, sutil) */
  .lock-icon {
    width: 40px;
    height: 40px;
    margin: 0 auto var(--space-4);
    display: grid;
    place-items: center;
    background: var(--color-primary-bg);
    color: var(--color-primary);
    border-radius: var(--radius-circle);
  }

  .lock-icon svg {
    width: 20px;
    height: 20px;
  }
</style>
</head>
<body>

<div class="app">

  <!-- Bloque marca -->
  <div class="brand-block">
    <img src="/assets/logos/grupo-cotorreo.png" alt="Grupo Cotorreo" class="brand-logo">
    <span class="brand-tag">Acceso interno</span>
  </div>

  <main class="main">

    <div class="lock-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1 class="page-title">Ingresá tu PIN</h1>
    <p class="page-subtitle">Tu rol se identifica automáticamente al entrar.</p>

    <div class="login-card">
      <form id="loginForm" onsubmit="return doLogin(event)">
        <div class="form-group">
          <label class="form-label" for="pinInput">
            PIN
            <span class="form-label-hint">4 a 8 dígitos</span>
          </label>
          <div class="input-wrap">
            <input
              type="password"
              id="pinInput"
              class="input-pin"
              placeholder="••••"
              inputmode="numeric"
              autocomplete="off"
              maxlength="8"
              pattern="\d{4,8}"
              required
            >
            <button type="button" class="pin-toggle" id="pinToggle" aria-label="Mostrar PIN" onclick="togglePin()">
              <svg id="eyeShow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg id="eyeHide" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="submitBtn">
          Entrar
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M13 5l7 7-7 7"/>
          </svg>
        </button>

        <div class="feedback" id="feedback">
          <svg id="feedbackIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/>
            <path d="M12 8v4M12 16h.01"/>
          </svg>
          <span id="feedbackMsg"></span>
        </div>
      </form>
    </div>

    <p class="alt-link">
      ¿Eres cliente? <a href="/cliente.html">Reservar aquí</a>
    </p>

  </main>

  <footer class="login-footer">
    Grupo Cotorreo · Sistema interno
    <br>
    ¿Olvidaste tu PIN? Contactá a <a href="https://wa.me/50672882394">Gerencia</a>
  </footer>

</div>

<script>
// Toggle mostrar/ocultar PIN
function togglePin() {
  const input = document.getElementById("pinInput");
  const show = document.getElementById("eyeShow");
  const hide = document.getElementById("eyeHide");
  const btn = document.getElementById("pinToggle");

  if (input.type === "password") {
    input.type = "text";
    show.style.display = "none";
    hide.style.display = "block";
    btn.setAttribute("aria-label", "Ocultar PIN");
  } else {
    input.type = "password";
    show.style.display = "block";
    hide.style.display = "none";
    btn.setAttribute("aria-label", "Mostrar PIN");
  }
}

// Stub login para preview — simula respuestas del backend
let failedAttempts = 0;

function doLogin(e) {
  e.preventDefault();
  const pin = document.getElementById("pinInput").value.replace(/[^0-9]/g, "");
  const fb = document.getElementById("feedback");
  const msg = document.getElementById("feedbackMsg");
  const icon = document.getElementById("feedbackIcon");
  const btn = document.getElementById("submitBtn");

  fb.classList.remove("visible", "success", "error", "warn");

  if (pin.length < 4) {
    fb.classList.add("visible", "error");
    msg.textContent = "El PIN debe tener al menos 4 dígitos.";
    return false;
  }

  // Simulación: PIN "123456" entra como Gerencia
  // PIN "1234" entra como Lili
  // PIN "5678" entra como Maestros
  // Cualquier otro = falla
  btn.disabled = true;
  btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Verificando...`;

  setTimeout(() => {
    btn.disabled = false;
    btn.innerHTML = `Entrar <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 5l7 7-7 7"/></svg>`;

    let role = null;
    if (pin === "1234") role = "Lili (recepción)";
    else if (pin === "5678") role = "Maestros (cocina)";
    else if (pin === "123456") role = "Gerencia";

    if (role) {
      fb.classList.add("visible", "success");
      msg.textContent = `Acceso correcto. Entrando como ${role}…`;
      failedAttempts = 0;
    } else {
      failedAttempts++;
      if (failedAttempts >= 3) {
        fb.classList.add("visible", "warn");
        msg.textContent = `Demasiados intentos fallidos. Esperá 30 segundos antes de reintentar.`;
        btn.disabled = true;
        setTimeout(() => { btn.disabled = false; failedAttempts = 0; }, 30000);
      } else {
        fb.classList.add("visible", "error");
        msg.textContent = `PIN incorrecto. Intento ${failedAttempts} de 3.`;
      }
    }
  }, 600);

  return false;
}

// Auto-focus
document.getElementById("pinInput").focus();
</script>

<style>
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }
  .btn-primary svg[style*="spin"] { width: 18px; height: 18px; }
</style>

</body>
</html>
