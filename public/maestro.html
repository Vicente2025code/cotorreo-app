<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#b87333">
<meta name="apple-mobile-web-app-title" content="Maestro">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/maestro.webmanifest">
<link rel="icon" type="image/svg+xml" href="/maestro-icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/maestro-icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="/maestro-icon-180.png">
<title>Panel Maestro — Grupo Cotorreo</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  .app-header {
    background: linear-gradient(135deg, #b87333, #d4a056) !important;
  }
  .card h2, .card h3 { color: #8a5626 !important; }
  .kpi .value { color: #8a5626 !important; }
  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus { border-color: #b87333 !important; }
  .btn-primary { background: #b87333 !important; }
  .btn-primary:hover { background: #d4a056 !important; }
  .tab.active { color: #b87333 !important; border-bottom-color: #b87333 !important; }
</style>
</head>
<body>

<div class="app">
  <div class="app-header">
    <div class="user-info">
      <div>
        <h1>🎾 <span id="userName">Maestro</span></h1>
        <div class="subtitle">Tus clases en Alpadel</div>
      </div>
      <button onclick="logout()">Salir</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="proximas">Próximas</button>
    <a class="tab" href="/calendario.html" style="text-decoration: none;">📅 Calendario</a>
    <button class="tab" data-tab="nueva">+ Nueva</button>
    <button class="tab" data-tab="recurrentes">🔁 Recurrentes</button>
    <button class="tab" data-tab="factura">Mi mes</button>
  </div>

  <div class="tab-content active" id="tab-proximas">
    <div id="proximas-list" class="loading">Cargando</div>
  </div>

  <div class="tab-content" id="tab-nueva">
    <div class="card">
      <h3>Nueva reserva</h3>
      <div class="form-group"><label>Fecha</label><input type="date" id="n-fecha" required></div>
      <div class="form-group"><label>Hora</label><select id="n-hora" required></select></div>
      <div class="form-group"><label>Duración</label><select id="n-duracion">
        <option value="1" selected>1 hora</option>
        <option value="1.5">1h 30 min</option>
        <option value="2">2 horas</option>
      </select></div>
      <div class="form-group"><label>Cancha</label><select id="n-cancha" required>
        <option value="Dobles">Cancha 1 — Dobles</option>
        <option value="Singles">Cancha 2 — Singles</option>
      </select></div>
      <div class="form-group"><label>Notas (opcional)</label><textarea id="n-notas"></textarea></div>
      <button class="btn btn-primary btn-block" onclick="crearReserva(this)">Crear reserva</button>
    </div>
  </div>

  <div class="tab-content" id="tab-recurrentes">
    <div class="card">
      <h3>🔁 Mis clases recurrentes</h3>
      <p class="hint" style="margin-bottom:14px;">Crea una vez y se repite cada semana mientras esté activa. Si pones notas, te ayuda a recordar el alumno o grupo.</p>
      <div id="recurrentes-list" class="loading">Cargando…</div>
      <hr style="margin:16px 0;border:none;border-top:1px solid var(--border);">
      <h4 style="margin-bottom:10px;">+ Nueva recurrente</h4>
      <div class="form-group"><label>Día de la semana</label><select id="rec-dia" required>
        <option value="">Selecciona...</option>
        <option value="Lunes">Lunes</option>
        <option value="Martes">Martes</option>
        <option value="Miércoles">Miércoles</option>
        <option value="Jueves">Jueves</option>
        <option value="Viernes">Viernes</option>
        <option value="Sábado">Sábado</option>
        <option value="Domingo">Domingo</option>
      </select></div>
      <div class="form-group"><label>Hora inicio</label><select id="rec-hora-ini" required></select></div>
      <div class="form-group"><label>Hora fin</label><select id="rec-hora-fin" required></select></div>
      <div class="form-group"><label>Cancha</label><select id="rec-cancha" required>
        <option value="Dobles">Cancha 1 — Dobles (grande)</option>
        <option value="Singles">Cancha 2 — Singles (pequeña)</option>
      </select></div>
      <div class="form-group"><label>Desde</label><input type="date" id="rec-desde" required></div>
      <div class="form-group"><label>Hasta</label><input type="date" id="rec-hasta" required></div>
      <div class="form-group"><label>Notas (opcional)</label><textarea id="rec-notas" placeholder="Alumno o grupo, equipo, etc."></textarea></div>
      <button class="btn btn-primary btn-block" onclick="crearRecurrente(this)">Crear recurrente</button>
    </div>
  </div>

  <div class="tab-content" id="tab-factura">
    <div class="card">
      <h3>📊 Mi mes</h3>
      <div id="factura-info" class="loading">Cargando</div>
    </div>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
if (!requireRole(["maestro"])) throw new Error("Sin permiso");

const user = getUser();
document.getElementById("userName").textContent = user.nombre;

// Tabs
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab").forEach(b => b.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-" + btn.dataset.tab).classList.add("active");
    if (btn.dataset.tab === "factura") loadFactura();
    if (btn.dataset.tab === "recurrentes") loadRecurrentes();
  });
});

// Llenar horas — value en 24h (backend), label en 12h AM/PM
function _to12h(h, m) { const p=h>=12?"PM":"AM"; const h12=h===0?12:(h>12?h-12:h); return `${h12}:${m} ${p}`; }
const horaSel = document.getElementById("n-hora");
horaSel.innerHTML = '<option value="">Selecciona...</option>';
for (let i = 7; i <= 22; i++) {
  horaSel.innerHTML += `<option value="${String(i).padStart(2,"0")}:00">${_to12h(i,"00")}</option>`;
  if (i < 22) horaSel.innerHTML += `<option value="${String(i).padStart(2,"0")}:30">${_to12h(i,"30")}</option>`;
}
document.getElementById("n-fecha").value = todayISO();

// Cargar próximas
async function loadProximas() {
  try {
    const r = await api("GET", "/api/mis-reservas");
    if (!r.futuras.length) {
      document.getElementById("proximas-list").innerHTML = "<div class='card'><em>Sin reservas futuras</em></div>";
      return;
    }
    document.getElementById("proximas-list").innerHTML = r.futuras.map(x => `
      <div class="reserva estado-${(x.estado || "").toLowerCase().replace("-", "")}">
        <div class="reserva-info">
          <div class="reserva-hora">${fmtFechaCorta(x.fechaHora)} · ${fmtHora(x.fechaHora)}-${fmtHora(x.horaFin)}</div>
          <div class="reserva-meta">${x.cancha} · ${x.duracion}h</div>
          <span class="badge ${(x.estado || "").toLowerCase().replace("-", "")}">${x.estado}</span>
        </div>
        <div class="reserva-acciones">
          <button class="btn btn-danger btn-sm" onclick="cancelar('${x.id}')">Cancelar</button>
        </div>
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("proximas-list").innerHTML = "Error: " + e.message;
  }
}

async function cancelar(id) {
  if (!confirm("¿Cancelar esta reserva?")) return;
  try {
    await api("DELETE", `/api/mi-reserva/${id}`);
    alert("✅ Cancelada. Lili y Vicente recibirán la alerta.");
    loadProximas();
  } catch (e) {
    alert("Error: " + e.message);
  }
}

async function crearReserva(btn) {
  const data = {
    fecha: document.getElementById("n-fecha").value,
    hora: document.getElementById("n-hora").value,
    duracion: parseFloat(document.getElementById("n-duracion").value),
    cancha: document.getElementById("n-cancha").value,
    notas: document.getElementById("n-notas").value,
  };
  if (!data.fecha || !data.hora || !data.cancha) return alert("Faltan datos");
  // Deshabilitar el botón mientras corre el request — evita que un doble click
  // dispare 2 POSTs. El backend también tiene mutex por si acaso.
  const textoOriginal = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = "Guardando..."; }
  try {
    await api("POST", "/api/mi-reserva", data);
    alert("✅ Reserva creada");
    document.querySelector('[data-tab="proximas"]').click();
    loadProximas();
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

async function loadFactura() {
  try {
    const mes = new Date().toISOString().slice(0, 7);
    const r = await api("GET", `/api/mi-facturacion?mes=${mes}`);
    const p = r.pagado || { clases: 0, horas: 0, monto: 0 };
    const pp = r.porPagar || { clases: 0, horas: 0, monto: 0 };
    document.getElementById("factura-info").innerHTML = `
      <div class="kpi" style="background:#e6f4ea; border-color:#c8e0d0;">
        <div class="label" style="color:#2d8a47;">✅ Pagado (clases ya dadas)</div>
        <div class="value" style="color:#2d8a47;">${fmtMonto(p.monto)}</div>
        <div class="hint">${p.clases} clase${p.clases === 1 ? "" : "s"} · ${p.horas}h</div>
      </div>
      <div class="kpi" style="background:#fcf2e1; border-color:#f0d9a8; margin-top:10px;">
        <div class="label" style="color:#b87333;">⏳ Por pagar (próximas del mes)</div>
        <div class="value" style="color:#b87333;">${fmtMonto(pp.monto)}</div>
        <div class="hint">${pp.clases} clase${pp.clases === 1 ? "" : "s"} · ${pp.horas}h</div>
      </div>
      <div class="kpi" style="margin-top:10px;">
        <div class="label">Total del mes</div>
        <div class="value">${fmtMonto(r.totalAPagar)}</div>
        <div class="hint">${r.reservas.length} clases · ${r.totalHoras}h</div>
      </div>
      <p class="hint" style="margin-top:12px;">Cierre el último día del mes. "Pagado" son clases ya dadas, "Por pagar" son las que faltan.</p>
    `;
  } catch (e) {
    document.getElementById("factura-info").innerHTML = "Error: " + e.message;
  }
}

// Llenar selects de horas (recurrentes) con label 12h AM/PM y value 24h.
(function pobrarHorasRecurrentes() {
  const to12 = (h, m) => { const p = h >= 12 ? "PM" : "AM"; const h12 = h === 0 ? 12 : (h > 12 ? h - 12 : h); return `${h12}:${m} ${p}`; };
  ["rec-hora-ini", "rec-hora-fin"].forEach(id => {
    const sel = document.getElementById(id);
    let html = '<option value="">Selecciona...</option>';
    for (let i = 7; i <= 22; i++) {
      html += `<option value="${String(i).padStart(2,"0")}:00">${to12(i,"00")}</option>`;
      if (i < 22) html += `<option value="${String(i).padStart(2,"0")}:30">${to12(i,"30")}</option>`;
    }
    sel.innerHTML = html;
  });
})();

async function loadRecurrentes() {
  try {
    const r = await api("GET", "/api/mis-recurrentes");
    const list = document.getElementById("recurrentes-list");
    if (!r.recurrentes.length) {
      list.innerHTML = '<div class="hint" style="text-align:center;padding:12px;">No tenés recurrentes activas todavía. Agregá una abajo.</div>';
      return;
    }
    const to12label = (s) => { if(!s) return ""; const [hh,mm] = s.split(":").map(x => parseInt(x,10) || 0); const p = hh >= 12 ? "PM" : "AM"; const h12 = hh === 0 ? 12 : (hh > 12 ? hh - 12 : hh); return `${h12}:${String(mm).padStart(2,"0")} ${p}`; };
    list.innerHTML = r.recurrentes.map(x => `
      <div style="border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;">
        <div style="font-weight:600;margin-bottom:4px;">🔁 ${x.diaSemana} · ${to12label(x.horaInicio)} – ${to12label(x.horaFin)}</div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:4px;">${x.cancha === "Singles" ? "Cancha 2 — Singles (pequeña)" : "Cancha 1 — Dobles (grande)"}</div>
        <div style="font-size:12px;color:var(--text-secondary);">Vigente del ${x.fechaInicio} al ${x.fechaFin}</div>
        ${x.notas ? `<div style="font-size:12px;margin-top:6px;font-style:italic;">${x.notas}</div>` : ""}
        <button class="btn btn-warn btn-sm" style="margin-top:8px;" onclick="desactivarRecurrente('${x.id}')">Desactivar</button>
      </div>
    `).join("");
  } catch (e) {
    document.getElementById("recurrentes-list").innerHTML = "Error: " + e.message;
  }
}

async function crearRecurrente(btn) {
  const body = {
    diaSemana: document.getElementById("rec-dia").value,
    horaInicio: document.getElementById("rec-hora-ini").value,
    horaFin: document.getElementById("rec-hora-fin").value,
    cancha: document.getElementById("rec-cancha").value,
    fechaInicio: document.getElementById("rec-desde").value,
    fechaFin: document.getElementById("rec-hasta").value,
    notas: document.getElementById("rec-notas").value.trim() || undefined,
  };
  if (!body.diaSemana || !body.horaInicio || !body.horaFin || !body.cancha || !body.fechaInicio || !body.fechaFin) {
    alert("Faltan datos. Completá todos los campos obligatorios.");
    return;
  }
  if (body.horaFin <= body.horaInicio) {
    alert("La hora fin debe ser posterior a la hora inicio.");
    return;
  }
  const textoOriginal = btn && btn.textContent;
  if (btn) { btn.disabled = true; btn.textContent = "Guardando..."; }
  try {
    const resp = await api("POST", "/api/mi-recurrente", body);
    const n = resp.reservas_generadas || 0;
    alert(`✅ Recurrente creada\n\n${n} clase${n === 1 ? "" : "s"} ya están en el calendario.`);
    document.getElementById("rec-dia").value = "";
    document.getElementById("rec-hora-ini").value = "";
    document.getElementById("rec-hora-fin").value = "";
    document.getElementById("rec-desde").value = "";
    document.getElementById("rec-hasta").value = "";
    document.getElementById("rec-notas").value = "";
    loadRecurrentes();
  } catch (e) {
    alert("Error: " + e.message);
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = textoOriginal; }
  }
}

async function desactivarRecurrente(id) {
  if (!confirm("¿Desactivar esta recurrente?\n\nDeja de generar futuras.")) return;
  const borrarFuturas = confirm("¿Borrar también las clases futuras que ya están en el calendario y aún no ocurrieron?\n\nACEPTAR: se limpian.\nCANCELAR: se quedan en el calendario.");
  try {
    const r = await api("DELETE", "/api/mi-recurrente/" + id + "?borrarFuturas=" + borrarFuturas);
    if (r.futuras_borradas > 0) alert(`✅ Recurrente desactivada. ${r.futuras_borradas} clases futuras borradas.`);
    loadRecurrentes();
  } catch (e) {
    alert("Error: " + e.message);
  }
}

loadProximas();
</script>
</body>
</html>
