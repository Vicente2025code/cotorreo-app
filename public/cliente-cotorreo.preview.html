<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservar mesa — Plaza Cotorreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    color: var(--text-primary);
    background: var(--surface-page);
    line-height: var(--leading-normal);
    font-size: var(--text-base);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 100px;
  }

  .app { max-width: var(--content-max); margin: 0 auto; min-height: 100vh; }

  /* Header */
  .app-header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding: var(--space-3) var(--space-4);
    background: var(--surface-page);
    border-bottom: 1px solid var(--border-subtle);
    position: sticky;
    top: 0;
    z-index: 10;
    overflow: hidden;
  }

  .header-back {
    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    color: var(--text-secondary);
    text-decoration: none;
    border-radius: var(--radius-md);
    transition: background var(--t-fast), color var(--t-fast);
    flex-shrink: 0;
  }

  .header-back:hover {
    background: var(--surface-muted);
    color: var(--text-primary);
  }

  .header-logo {
    height: 80px;
    width: auto;
    margin-left: auto;
    margin-right: auto;
    padding-right: 40px;
    mix-blend-mode: multiply;
    display: block;
  }

  /* Greeting */
  .greeting {
    background: var(--color-success-bg);
    border-left: 3px solid var(--color-success);
    color: var(--color-success);
    padding: var(--space-3) var(--space-4);
    margin: var(--space-4) auto 0;
    border-radius: var(--radius-md);
    font-size: var(--text-sm);
    display: none;
    align-items: flex-start;
    gap: var(--space-2);
    max-width: 560px;
  }

  .greeting.visible { display: flex; }

  .greeting svg {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  /* Main */
  .main {
    padding: var(--space-6) var(--space-4) var(--space-6);
    max-width: 560px;
    margin: 0 auto;
  }

  /* Secciones */
  .section {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    margin-bottom: var(--space-4);
    box-shadow: var(--shadow-sm);
  }

  .section-title {
    font-size: var(--text-xs);
    font-weight: var(--weight-semibold);
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--text-tertiary);
    margin-bottom: var(--space-4);
    padding-bottom: var(--space-3);
    border-bottom: 1px solid var(--border-subtle);
  }

  /* Form group */
  .form-group { margin-bottom: var(--space-4); }
  .form-group:last-child { margin-bottom: 0; }

  .form-label {
    display: block;
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin-bottom: var(--space-2);
  }

  .form-label .required {
    color: var(--color-accent-emo);
    margin-left: 2px;
  }

  .form-label .opt {
    color: var(--text-tertiary);
    font-weight: var(--weight-regular);
    margin-left: var(--space-2);
    font-size: var(--text-xs);
  }

  /* Inputs */
  .input,
  .select,
  .textarea {
    width: 100%;
    min-height: var(--input-h);
    padding: 0 var(--space-3);
    border: 1.5px solid var(--border-subtle);
    border-radius: var(--radius-md);
    background: var(--surface-card);
    font-family: inherit;
    font-size: var(--text-base);
    color: var(--text-primary);
    outline: none;
    transition: border-color var(--t-base), box-shadow var(--t-base);
    -webkit-appearance: none;
    appearance: none;
  }

  .input:focus,
  .select:focus,
  .textarea:focus {
    border-color: var(--color-primary);
    box-shadow: var(--shadow-focus);
  }

  .select {
    padding-right: var(--space-8);
    background-image: url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23475569' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='m6 9 6 6 6-6'/%3E%3C/svg%3E");
    background-repeat: no-repeat;
    background-position: right var(--space-3) center;
    background-size: 16px;
  }

  .textarea {
    padding: var(--space-3);
    min-height: 80px;
    resize: vertical;
  }

  .input-hint {
    display: block;
    margin-top: var(--space-2);
    font-size: var(--text-xs);
    color: var(--text-tertiary);
  }

  /* Row para fecha/hora juntos */
  .row-2 {
    display: grid;
    grid-template-columns: 1fr 2fr;
    gap: var(--space-3);
  }

  .row-half {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-3);
  }

  /* Bottom bar sticky */
  .bottom-bar {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface-card);
    border-top: 1px solid var(--border-subtle);
    padding: var(--space-3) var(--space-4);
    z-index: 20;
    box-shadow: 0 -4px 12px rgba(15, 23, 42, 0.04);
  }

  .bottom-bar-inner { max-width: 560px; margin: 0 auto; }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: 52px;
    padding: 0 var(--space-5);
    background: var(--color-primary);
    color: var(--text-on-brand);
    border: none;
    border-radius: var(--radius-md);
    font-family: inherit;
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    cursor: pointer;
    transition: background var(--t-fast), transform var(--t-fast);
  }

  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-primary:active { transform: scale(0.99); }
  .btn-primary svg { width: 18px; height: 18px; }

  /* Toggle preview */
  .preview-toggle {
    position: fixed;
    top: 0;
    right: 0;
    background: var(--color-primary);
    color: white;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    z-index: 100;
    border-radius: 0 0 0 var(--radius-md);
    border: none;
    font-family: inherit;
  }
</style>
</head>
<body>

<button class="preview-toggle" onclick="toggleEstado()">Cambiar a cliente <span id="estadoLabel">existente</span></button>

<div class="app">
  <header class="app-header">
    <a href="/cliente-telefono.preview.html" class="header-back" aria-label="Volver">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m15 18-6-6 6-6"/>
      </svg>
    </a>
    <img src="/assets/logos/plaza-cotorreo.png" alt="Plaza Cotorreo" class="header-logo">
  </header>

  <div class="greeting visible" id="greeting">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
    <span>Hola <strong>Andrea</strong>, ya te conocemos. Solo completa los datos de tu reserva.</span>
  </div>

  <main class="main">

    <!-- SECCIÓN: Tus datos (solo cliente nuevo) -->
    <section class="section" id="seccionDatos" style="display:none;">
      <h2 class="section-title">Tus datos</h2>

      <div class="form-group">
        <label class="form-label" for="nombre">Nombre completo <span class="required">*</span></label>
        <input type="text" class="input" id="nombre" autocomplete="name">
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email <span class="required">*</span></label>
        <input type="email" class="input" id="email" inputmode="email" autocomplete="email">
      </div>

      <div class="form-group">
        <label class="form-label">Cumpleaños <span class="required">*</span> <span class="opt">(día y mes)</span></label>
        <div class="row-2">
          <select class="select" id="cumpleDia"><option value="">Día</option></select>
          <select class="select" id="cumpleMes"><option value="">Mes</option></select>
        </div>
        <span class="input-hint">Para felicitarte cada año 🎂</span>
      </div>
    </section>

    <!-- SECCIÓN: Detalles de la reserva -->
    <section class="section">
      <h2 class="section-title">Detalles de la reserva</h2>

      <div class="form-group">
        <label class="form-label" for="fechaHora">Fecha y hora <span class="required">*</span></label>
        <input type="datetime-local" class="input" id="fechaHora">
      </div>

      <div class="form-group">
        <label class="form-label" for="personas">Cantidad de personas <span class="required">*</span></label>
        <input type="number" class="input" id="personas" min="1" max="20" inputmode="numeric">
        <span class="input-hint">Entre 1 y 20</span>
      </div>
    </section>

    <!-- SECCIÓN: Preferencias -->
    <section class="section">
      <h2 class="section-title">Preferencias</h2>

      <div class="form-group">
        <label class="form-label" for="ocasion">Ocasión <span class="opt">(opcional)</span></label>
        <select class="select" id="ocasion">
          <option value="Ninguna">Ninguna</option>
          <option value="Cumpleanos">Cumpleaños</option>
          <option value="Aniversario">Aniversario</option>
          <option value="Familiar">Reunión familiar</option>
          <option value="Negocios">Negocios</option>
          <option value="Otra">Otra</option>
        </select>
        <span class="input-hint">Si nos avisas, preparamos algo especial</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="area">Área preferida <span class="opt">(opcional)</span></label>
        <select class="select" id="area">
          <option value="">Sin preferencia</option>
          <option value="Planta baja">Planta baja</option>
          <option value="Planta alta">Planta alta</option>
          <option value="Cerca del playground">Cerca del playground</option>
          <option value="Planta alta pasillo con vista al arroyo">Planta alta · vista al arroyo</option>
          <option value="Balcón por pool">Balcón por pool</option>
          <option value="Sillas moradas">Sillas moradas</option>
        </select>
        <span class="input-hint">Si está disponible te la asignamos</span>
      </div>
    </section>

    <!-- SECCIÓN: Información adicional -->
    <section class="section">
      <h2 class="section-title">Información adicional</h2>

      <div class="form-group">
        <label class="form-label" for="notas">Notas <span class="opt">(opcional)</span></label>
        <textarea class="textarea" id="notas" placeholder="Silla alta, decoración, alergias..."></textarea>
      </div>
    </section>

  </main>

  <div class="bottom-bar">
    <div class="bottom-bar-inner">
      <button type="button" class="btn-primary" onclick="confirmar()">
        Confirmar reserva
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12h14M13 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<script>
// Selects de cumple
const meses = [
  ["01","Enero"],["02","Febrero"],["03","Marzo"],["04","Abril"],
  ["05","Mayo"],["06","Junio"],["07","Julio"],["08","Agosto"],
  ["09","Septiembre"],["10","Octubre"],["11","Noviembre"],["12","Diciembre"]
];
const cumpleDia = document.getElementById("cumpleDia");
const cumpleMes = document.getElementById("cumpleMes");
for (let i = 1; i <= 31; i++) {
  const o = document.createElement("option");
  o.value = String(i).padStart(2, "0");
  o.textContent = i;
  cumpleDia.appendChild(o);
}
meses.forEach(([v, n]) => {
  const o = document.createElement("option");
  o.value = v;
  o.textContent = n;
  cumpleMes.appendChild(o);
});

// Fecha-hora default: hoy a las 19:00
const today = new Date();
today.setHours(19, 0, 0, 0);
const defaultDT = new Date(today.getTime() - today.getTimezoneOffset() * 60000)
  .toISOString().slice(0,16);
document.getElementById("fechaHora").value = defaultDT;

let esNuevo = false;
function toggleEstado() {
  esNuevo = !esNuevo;
  document.getElementById("seccionDatos").style.display = esNuevo ? "block" : "none";
  document.getElementById("greeting").classList.toggle("visible", !esNuevo);
  document.getElementById("estadoLabel").textContent = esNuevo ? "existente" : "nuevo";
}

function confirmar() {
  alert("(Preview) Aquí se confirmaría la reserva y se mostraría la pantalla de éxito.");
}
</script>

</body>
</html>
