<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grupo Cotorreo · Reservas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: var(--font-family);
    color: var(--text-primary);
    background: var(--surface-page);
    line-height: var(--leading-normal);
    font-size: var(--text-base);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  .home {
    max-width: var(--content-max);
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    padding: var(--space-6) var(--space-4);
  }

  /* Header con logo paraguas centrado */
  .home-header {
    padding-top: var(--space-10);
    padding-bottom: var(--space-6);
    text-align: center;
  }

  .home-logo {
    height: 240px;      /* contenedor grande para acomodar el scale */
    width: auto;
    display: inline-block;
    transform: scale(1.4);  /* compensa el whitespace integrado del PNG */
    transform-origin: center;
    mix-blend-mode: multiply;
  }

  .home-tagline {
    margin-top: var(--space-3);
    font-size: var(--text-sm);
    color: var(--text-secondary);
    font-weight: var(--weight-regular);
  }

  /* Sección principal */
  .home-main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .home-question {
    font-size: var(--text-xl);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin-bottom: var(--space-5);
    text-align: center;
  }

  .home-options {
    display: flex;
    flex-direction: column;
    gap: var(--space-4);
    max-width: 420px;
    margin: 0 auto;
    width: 100%;
  }

  .option {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-5) var(--space-5);
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    text-decoration: none;
    color: var(--text-primary);
    box-shadow: var(--shadow-sm);
    transition: border-color var(--t-fast), transform var(--t-fast), box-shadow var(--t-fast);
  }

  .option:hover {
    border-color: var(--color-primary);
    box-shadow: var(--shadow-md);
    transform: translateY(-1px);
  }

  .option:active {
    transform: translateY(0);
  }

  .option-icon {
    flex-shrink: 0;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    border-radius: var(--radius-md);
    background: var(--color-primary-bg);
    color: var(--color-primary);
  }

  .option-icon svg {
    width: 24px;
    height: 24px;
    stroke-width: 1.75;
  }

  .option-body {
    flex: 1;
    min-width: 0;
  }

  .option-title {
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    line-height: var(--leading-snug);
  }

  .option-desc {
    margin-top: 2px;
    font-size: var(--text-sm);
    color: var(--text-secondary);
    line-height: var(--leading-snug);
  }

  .option-chevron {
    flex-shrink: 0;
    color: var(--text-tertiary);
    transition: transform var(--t-fast), color var(--t-fast);
  }

  .option:hover .option-chevron {
    color: var(--color-primary);
    transform: translateX(2px);
  }

  /* Footer mínimo */
  .home-footer {
    text-align: center;
    padding-top: var(--space-10);
    padding-bottom: var(--space-4);
    font-size: var(--text-xs);
    color: var(--text-tertiary);
  }

  /* Responsive: viewports > 720px, igual estructura */
  @media (min-width: 720px) {
    .home-header { padding-top: var(--space-16); }
  }
</style>
</head>
<body>

<main class="home">
  <header class="home-header">
    <img src="/assets/logos/grupo-cotorreo.png" alt="Grupo Cotorreo" class="home-logo">
    <p class="home-tagline">Sistema de reservas — Plaza Cotorreo y Alpadel</p>
  </header>

  <section class="home-main">
    <h1 class="home-question">¿Cómo te ayudamos?</h1>

    <div class="home-options">
      <a href="/cliente.html" class="option">
        <span class="option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <path d="M16 2v4M8 2v4M3 10h18"/>
          </svg>
        </span>
        <span class="option-body">
          <span class="option-title">Reservar</span>
          <span class="option-desc">Mesa en Plaza Cotorreo o cancha en Alpadel</span>
        </span>
        <span class="option-chevron" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>
      </a>

      <a href="/login.html" class="option">
        <span class="option-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </span>
        <span class="option-body">
          <span class="option-title">Soy del equipo</span>
          <span class="option-desc">Acceso para staff, maestros y gerencia</span>
        </span>
        <span class="option-chevron" aria-hidden="true">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m9 18 6-6-6-6"/>
          </svg>
        </span>
      </a>
    </div>
  </section>

  <footer class="home-footer">
    Grupo Cotorreo · Ciudad Quesada, San Carlos
  </footer>
</main>

</body>
</html>
