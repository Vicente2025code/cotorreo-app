<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reserva confirmada — Grupo Cotorreo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/tokens.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    color: var(--text-primary);
    background: var(--surface-page);
    line-height: var(--leading-normal);
    font-size: var(--text-base);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: var(--content-max); margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

  /* Header */
  .app-header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-3) var(--space-4);
    background: var(--surface-page);
    border-bottom: 1px solid var(--border-subtle);
  }

  .header-logo {
    height: 80px;
    width: auto;
    mix-blend-mode: multiply;
    display: block;
  }

  /* Main */
  .main {
    flex: 1;
    padding: var(--space-8) var(--space-4) var(--space-6);
    max-width: 520px;
    margin: 0 auto;
    width: 100%;
  }

  /* Hero: círculo check + título */
  .hero {
    text-align: center;
    margin-bottom: var(--space-8);
  }

  .check-circle {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: var(--color-primary);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: var(--space-5);
    /* sutil entrada al cargar */
    animation: pop 320ms cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }

  @keyframes pop {
    from { transform: scale(0.6); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .check-circle svg {
    width: 44px;
    height: 44px;
    color: white;
    stroke-width: 2.5;
  }

  .hero-title {
    font-size: var(--text-3xl);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    line-height: var(--leading-tight);
    margin-bottom: var(--space-3);
  }

  .hero-greeting {
    font-size: var(--text-base);
    color: var(--text-secondary);
  }

  /* Card de resumen */
  .summary-card {
    background: var(--surface-card);
    border: 1px solid var(--border-subtle);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    margin-bottom: var(--space-4);
    box-shadow: var(--shadow-sm);
  }

  .summary-header {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    padding-bottom: var(--space-4);
    margin-bottom: var(--space-4);
    border-bottom: 1px solid var(--border-subtle);
  }

  .summary-icon {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    background: var(--color-primary-bg);
    display: grid;
    place-items: center;
    color: var(--color-primary);
    flex-shrink: 0;
  }

  .summary-icon svg { width: 22px; height: 22px; }

  .summary-tipo {
    font-size: var(--text-xs);
    color: var(--text-tertiary);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: var(--weight-semibold);
  }

  .summary-where {
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    margin-top: 2px;
  }

  /* Detalles en lista */
  .detail-list {
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: var(--space-3);
  }

  .detail-row {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--space-4);
  }

  .detail-label {
    font-size: var(--text-sm);
    color: var(--text-secondary);
    flex-shrink: 0;
  }

  .detail-value {
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    text-align: right;
  }

  /* Card WhatsApp destacada */
  .whatsapp-card {
    background: var(--color-primary-bg);
    border: 1px solid var(--color-primary);
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-5);
    margin-bottom: var(--space-6);
    display: flex;
    align-items: center;
    gap: var(--space-4);
  }

  .whatsapp-icon {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--color-primary);
    color: white;
    display: grid;
    place-items: center;
  }

  .whatsapp-icon svg { width: 22px; height: 22px; }

  .whatsapp-body {
    flex: 1;
    min-width: 0;
  }

  .whatsapp-label {
    font-size: var(--text-xs);
    color: var(--color-primary);
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: var(--weight-semibold);
    margin-bottom: 2px;
  }

  .whatsapp-phone {
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
    font-variant-numeric: tabular-nums;
  }

  .whatsapp-note {
    font-size: var(--text-xs);
    color: var(--text-secondary);
    margin-top: 2px;
  }

  /* Botón secundario para volver al inicio */
  .btn-secondary {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    width: 100%;
    height: var(--input-h);
    padding: 0 var(--space-5);
    background: var(--surface-card);
    color: var(--text-primary);
    border: 1.5px solid var(--border-strong);
    border-radius: var(--radius-md);
    text-decoration: none;
    font-family: inherit;
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    cursor: pointer;
    transition: background var(--t-fast), border-color var(--t-fast);
  }

  .btn-secondary:hover {
    background: var(--surface-muted);
    border-color: var(--color-primary);
  }

  .btn-secondary svg { width: 18px; height: 18px; }

  /* Toggle preview entre Alpadel y Plaza */
  .preview-toggle {
    position: fixed;
    top: 0;
    right: 0;
    background: var(--color-primary);
    color: white;
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
    z-index: 100;
    border-radius: 0 0 0 var(--radius-md);
    border: none;
    font-family: inherit;
  }
</style>
</head>
<body>

<button class="preview-toggle" onclick="toggleTipo()">Ver como: <span id="tipoLabel">Cancha</span></button>

<div class="app">
  <header class="app-header">
    <img src="/assets/logos/grupo-cotorreo.png" alt="Grupo Cotorreo" class="header-logo">
  </header>

  <main class="main">
    <div class="hero">
      <div class="check-circle" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
      </div>
      <h1 class="hero-title">¡Reserva confirmada!</h1>
      <p class="hero-greeting" id="heroGreeting">Gracias <strong>Vicente</strong>, te esperamos en Alpadel.</p>
    </div>

    <!-- Card de resumen -->
    <section class="summary-card">
      <div class="summary-header">
        <div class="summary-icon" id="summaryIcon">
          <!-- Icono dinámico según tipo -->
        </div>
        <div>
          <div class="summary-tipo" id="summaryTipo">Cancha de pádel</div>
          <div class="summary-where" id="summaryWhere">Alpadel · Cancha 1 Dobles</div>
        </div>
      </div>

      <ul class="detail-list" id="detailList">
        <!-- pobladas por JS -->
      </ul>
    </section>

    <!-- Card WhatsApp -->
    <div class="whatsapp-card">
      <div class="whatsapp-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M17.498 14.382c-.301-.15-1.767-.867-2.04-.966-.273-.101-.473-.15-.673.15-.197.295-.771.964-.944 1.162-.175.195-.349.21-.646.075-.3-.15-1.263-.465-2.403-1.485-.888-.795-1.484-1.77-1.66-2.07-.174-.3-.019-.465.13-.615.136-.135.301-.345.451-.523.146-.181.194-.301.297-.496.1-.21.049-.375-.025-.524-.075-.15-.672-1.62-.922-2.206-.24-.584-.487-.51-.672-.51-.172-.015-.371-.015-.571-.015-.2 0-.523.074-.797.359-.273.3-1.045 1.02-1.045 2.475s1.07 2.865 1.219 3.075c.149.18 2.095 3.195 5.076 4.485.709.305 1.262.484 1.694.621.712.227 1.36.195 1.871.121.571-.085 1.758-.719 2.006-1.413.255-.689.255-1.276.18-1.418-.074-.135-.27-.21-.57-.345m-5.421 7.403h-.004a9.87 9.87 0 0 1-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 0 1-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 0 1 2.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0 0 12.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 0 0 5.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 0 0-3.48-8.413z"/>
        </svg>
      </div>
      <div class="whatsapp-body">
        <div class="whatsapp-label">Confirmación enviada</div>
        <div class="whatsapp-phone">+506 ••• ••94</div>
        <div class="whatsapp-note">Revisa tu WhatsApp</div>
      </div>
    </div>

    <a href="/" class="btn-secondary">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>
      </svg>
      Volver al inicio
    </a>
  </main>
</div>

<script>
// Iconos según tipo
const iconCancha = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M2 12h20M12 3v18"/></svg>`;
const iconMesa = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 13v8M18 13v8M3 9h18l-1.5 4h-15z"/><path d="M5 9V5h14v4"/></svg>`;

// Detalles según tipo
const detallesCancha = [
  { label: "Fecha", value: "Lunes 25 de mayo, 2026" },
  { label: "Hora", value: "19:00 – 21:00" },
  { label: "Duración", value: "2 horas" },
  { label: "Cancha", value: "Cancha 1 Dobles (grande)" }
];

const detallesMesa = [
  { label: "Fecha", value: "Sábado 30 de mayo, 2026" },
  { label: "Hora", value: "19:00" },
  { label: "Personas", value: "4 personas" },
  { label: "Ocasión", value: "Aniversario" },
  { label: "Área", value: "Balcón por pool" }
];

let tipo = "cancha";

function render() {
  if (tipo === "cancha") {
    document.getElementById("summaryIcon").innerHTML = iconCancha;
    document.getElementById("summaryTipo").textContent = "Cancha de pádel";
    document.getElementById("summaryWhere").textContent = "Alpadel · Cancha 1 Dobles";
    document.getElementById("heroGreeting").innerHTML = "Gracias <strong>Vicente</strong>, te esperamos en Alpadel.";
    renderDetalles(detallesCancha);
    document.getElementById("tipoLabel").textContent = "Cancha";
  } else {
    document.getElementById("summaryIcon").innerHTML = iconMesa;
    document.getElementById("summaryTipo").textContent = "Mesa en restaurante";
    document.getElementById("summaryWhere").textContent = "Plaza Cotorreo";
    document.getElementById("heroGreeting").innerHTML = "Gracias <strong>Andrea</strong>, te esperamos en Plaza Cotorreo.";
    renderDetalles(detallesMesa);
    document.getElementById("tipoLabel").textContent = "Mesa";
  }
}

function renderDetalles(d) {
  document.getElementById("detailList").innerHTML = d.map(item => `
    <li class="detail-row">
      <span class="detail-label">${item.label}</span>
      <span class="detail-value">${item.value}</span>
    </li>
  `).join("");
}

function toggleTipo() {
  tipo = tipo === "cancha" ? "mesa" : "cancha";
  render();
}

render();
</script>

</body>
</html>
