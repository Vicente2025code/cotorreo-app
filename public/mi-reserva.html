<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0d4a4e">
<title>Mi reserva — Grupo Cotorreo</title>
<link rel="stylesheet" href="/css/styles.css">
<style>
  body { background: var(--cream); }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 20px; min-height: 100vh; }
  .brand { text-align:center; margin-bottom: 24px; }
  .brand h1 { color: var(--primary); font-size: 20px; }
  .card { background: var(--paper); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.04); }
  .badge { display:inline-block; padding:4px 10px; border-radius:12px; font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.5px; }
  .badge.confirmada { background:#e6f4ea; color:#2d8a47; }
  .badge.cancelada { background:#fce8e6; color:#c53030; }
  .badge.completada { background:#e8e2d6; color:#4a5759; }
  .field { margin-top: 14px; }
  .field-label { font-size:12px; color:var(--ink-soft); text-transform:uppercase; letter-spacing:0.5px; font-weight:600; }
  .field-value { font-size:16px; color:var(--ink); margin-top:2px; }
  .field-value.big { font-size:20px; font-weight:700; color:var(--primary); }
  .btn-danger { background:#c53030; color:white; border:none; padding:14px; border-radius:8px; width:100%; font-size:15px; font-weight:600; cursor:pointer; margin-top:20px; }
  .btn-danger:hover { background:#a02525; }
  .btn-danger:disabled { opacity:0.5; cursor:not-allowed; }
  .warn { margin-top: 16px; padding: 12px 14px; background:#fcf2e1; border-left: 3px solid #b87333; border-radius:8px; color:#8B6914; font-size:14px; line-height:1.4; }
  .info { margin-top: 16px; padding: 12px 14px; background:#ebf4ff; border-left: 3px solid #2c5282; border-radius:8px; color:#2c5282; font-size:14px; line-height:1.4; }
  .error { margin-top: 16px; padding: 12px 14px; background:#fce8e6; border-left: 3px solid #c53030; border-radius:8px; color:#c53030; font-size:14px; line-height:1.4; }
  .loading { text-align:center; padding: 40px; color: var(--ink-soft); }
  .wa-link { display:block; text-align:center; margin-top:20px; color:var(--primary); font-weight:600; text-decoration:none; padding:12px; border:1px solid var(--border); border-radius:8px; }
</style>
</head>
<body>

<div class="wrap">
  <div class="brand">
    <h1>Mi reserva</h1>
  </div>

  <div id="content" class="loading">Cargando…</div>
</div>

<script>
const CR_TZ = "America/Costa_Rica";
const DIAS = ["dom","lun","mar","mié","jue","vie","sáb"];
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const WA_NUM = "50672882394";

function fmtFecha(iso) {
  const d = new Date(iso);
  const parts = new Intl.DateTimeFormat("es-CR", { timeZone: CR_TZ, weekday:"long", day:"numeric", month:"long" }).format(d);
  return parts;
}
function fmtHora(iso) {
  const d = new Date(iso);
  return new Intl.DateTimeFormat("es-CR", { timeZone: CR_TZ, hour:"2-digit", minute:"2-digit", hour12:true }).format(d);
}

async function cargar() {
  const params = new URLSearchParams(window.location.search);
  const token = (params.get("t") || "").trim();
  const content = document.getElementById("content");

  if (!token) {
    content.innerHTML = `<div class="card"><div class="error">Link inválido. Por favor abrí el link que te llegó por WhatsApp.</div></div>`;
    return;
  }

  try {
    const r = await fetch(`/api/mi-reserva/${encodeURIComponent(token)}`);
    if (r.status === 404) {
      content.innerHTML = `<div class="card"><div class="error">Reserva no encontrada. Puede que el link haya expirado.</div><a class="wa-link" href="https://wa.me/${WA_NUM}">Escribinos por WhatsApp</a></div>`;
      return;
    }
    if (!r.ok) throw new Error("HTTP " + r.status);
    const d = await r.json();
    renderReserva(d);
  } catch (e) {
    content.innerHTML = `<div class="card"><div class="error">Error de conexión. Intentá recargar la página.</div></div>`;
  }
}

function renderReserva(d) {
  const content = document.getElementById("content");
  const estado = (d.estado || "").toLowerCase();
  const badge = `<span class="badge ${estado}">${d.estado}</span>`;

  let detalle = "";
  if (d.tipo === "alpadel") {
    detalle = `
      <div class="field">
        <div class="field-label">Día</div>
        <div class="field-value">${fmtFecha(d.inicio)}</div>
      </div>
      <div class="field">
        <div class="field-label">Hora</div>
        <div class="field-value big">${fmtHora(d.inicio)}${d.fin ? " – " + fmtHora(d.fin) : ""}</div>
      </div>
      <div class="field">
        <div class="field-label">Cancha</div>
        <div class="field-value">${d.cancha || "-"}</div>
      </div>`;
  } else {
    detalle = `
      <div class="field">
        <div class="field-label">Día</div>
        <div class="field-value">${fmtFecha(d.inicio)}</div>
      </div>
      <div class="field">
        <div class="field-label">Hora</div>
        <div class="field-value big">${fmtHora(d.inicio)}</div>
      </div>
      <div class="field">
        <div class="field-label">Personas</div>
        <div class="field-value">${d.personas || "-"}</div>
      </div>
      ${d.area ? `<div class="field"><div class="field-label">Área</div><div class="field-value">${d.area}</div></div>` : ""}`;
  }

  let accion = "";
  if (d.puede_cancelar) {
    accion = `<button class="btn-danger" onclick="cancelarReserva()">Cancelar esta reserva</button>
      <div class="info">Si querés cambiar hora o cancha, cancelá esta reserva y hacé una nueva desde <a href="/cliente.html" style="color:#2c5282;font-weight:700;">reservas</a>.</div>`;
  } else {
    accion = `<div class="warn">${d.motivo_no_cancelar || "No podés cancelar esta reserva desde acá."}</div>
      <a class="wa-link" href="https://wa.me/${WA_NUM}">Escribinos por WhatsApp</a>`;
  }

  content.innerHTML = `
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div><strong style="font-size:15px;">${d.nombre || "Tu reserva"}</strong></div>
        ${badge}
      </div>
      ${detalle}
      ${accion}
    </div>`;
}

async function cancelarReserva() {
  if (!confirm("¿Seguro que querés cancelar esta reserva?\n\nEsta acción no se puede deshacer.")) return;
  const params = new URLSearchParams(window.location.search);
  const token = params.get("t");
  const btn = document.querySelector(".btn-danger");
  btn.disabled = true;
  btn.textContent = "Cancelando…";
  try {
    const r = await fetch(`/api/mi-reserva/${encodeURIComponent(token)}/cancelar`, { method:"POST" });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "Error");
    // recargar para mostrar el estado cancelada
    document.getElementById("content").innerHTML = `
      <div class="card">
        <div style="text-align:center; padding:20px 0;">
          <div style="font-size:56px; margin-bottom:12px;">✅</div>
          <h2 style="color:var(--primary); margin-bottom:8px;">Reserva cancelada</h2>
          <p style="color:var(--ink-soft);">La cancha queda liberada para otros clientes. ¡Gracias por avisar!</p>
        </div>
        <a class="wa-link" href="/cliente.html">Hacer otra reserva</a>
      </div>`;
  } catch (e) {
    alert("Error: " + e.message);
    btn.disabled = false;
    btn.textContent = "Cancelar esta reserva";
  }
}

cargar();
</script>

</body>
</html>
